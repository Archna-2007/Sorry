<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    background: white;
    width: 100%;
    max-width: 600px;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
  }

  p {
    text-align: center;
    margin-bottom: 30px;
    color: #666;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  input,
  textarea,
  select {
    width: 100%;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
  }

  textarea {
    min-height: 150px;
    resize: vertical;
  }

  button {
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #d4a5a5;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    opacity: 0.9;
  }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    text-decoration: none;
    color: #888;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Your Feedback</h1>
  <p>I’d love to know what you think about this.</p>

  <!-- Notice the action and method attributes added here -->
  <form action="https://formsubmit.co/archanasoysa2007@gmail.com" method="POST">
    
    <!-- Added name="name" -->
    <input type="text" name="name" placeholder="Your Name" required>

    <!-- Added name="message" -->
    <textarea name="message" placeholder="Write your thoughts here..." required></textarea>

    <!-- Added name="rating" -->
    <select name="rating" required>
      <option value="">Rate this</option>
      <option value="1 Star">⭐</option>
      <option value="2 Stars">⭐⭐</option>
      <option value="3 Stars">⭐⭐⭐</option>
      <option value="4 Stars">⭐⭐⭐⭐</option>
      <option value="5 Stars">⭐⭐⭐⭐⭐</option>
    </select>

    <!-- Optional: Add a hidden input to redirect back to your memories page after submitting -->
    <input type="hidden" name="_next" value="our memories.html">
    
    <!-- Optional: Disable Captcha if you want a smoother experience -->
    <input type="hidden" name="_captcha" value="false">

    <button type="submit">Send Feedback</button>
  </form>

  <a href="our memories.html" class="back-link">← Back to Memories</a>
</div>

</body>
</html>
